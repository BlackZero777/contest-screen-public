name: Sync public contest data

on:
  push:
    branches:
      - main
    paths-ignore:
      - contest-feed.js
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: contest-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and screening rules
        run: |
          node --check rules.js
          node --check discover.js
          node --check scripts/sync-contests.mjs
          node test-rules.js
      - name: Synchronize public contest data
        run: node scripts/sync-contests.mjs
      - name: Update public data cache through GitHub API (with retry)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'contest-feed.js';
            const content = fs.readFileSync(path, 'utf8');
            const encoded = Buffer.from(content, 'utf8').toString('base64');
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                const currentText = Buffer.from(current.data.content, 'base64').toString('utf8');
                if (currentText === content) {
                  core.info('Contest cache is unchanged; no commit required.');
                  return;
                }
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  branch: 'main',
                  message: 'Refresh public contest data cache',
                  content: encoded,
                  sha: current.data.sha
                });
                core.info('Contest cache updated through GitHub Contents API.');
                return;
              } catch (error) {
                lastError = error;
                const status = error.status || error.response?.status;
                if (![409, 422, 500, 502, 503, 504].includes(status) || attempt === 5) throw error;
                core.warning(`GitHub API update attempt ${attempt} failed (HTTP ${status}); retrying.`);
                await sleep(1500 * attempt);
              }
            }
            throw lastError;
